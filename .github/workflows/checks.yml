# The 41 offline harnesses in tools/, run on every push.
#
# They existed before this workflow did and were run by hand, which is the same
# as not being run: prose has no type checker, and what these guard is mostly
# prose — a blueprint's exclusions, a routing ladder, the shape of three
# vendors' request bodies. An exclusion can be deleted and nothing anywhere
# fails. That is what this is for.
#
# Four of the forty-five are not here. check:builder, check:payments,
# check:auth-domain and check:live reach the network, need a key, or read live
# DNS — they are probes of a deployment rather than tests of this repository,
# and a CI job that goes red because a third party is slow is a CI job people
# learn to ignore.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Before the harnesses, because they compile the modules they test with
      # tsc and a type error there reads as a confusing harness failure.
      - run: npx tsc --noEmit
      - run: npm test
